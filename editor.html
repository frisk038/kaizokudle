<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Character Editor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: sans-serif;
    background: #111;
    color: #eee;
    padding: 24px;
  }

  h1 { margin-bottom: 16px; font-size: 1.4rem; }

  #toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  #toolbar input[type="file"] { color: #ccc; }

  button {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  #save-btn {
    background: #2a7a2a;
    color: #fff;
  }

  #save-btn:hover { background: #338a33; }

  #count { color: #aaa; font-size: 0.9rem; }

  #search {
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #222;
    color: #eee;
    font-size: 0.9rem;
    width: 220px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  thead th {
    background: #222;
    padding: 10px 8px;
    text-align: left;
    position: sticky;
    top: 0;
    z-index: 1;
    border-bottom: 2px solid #333;
    user-select: none;
  }

  thead th.sortable {
    cursor: pointer;
  }

  thead th.sortable:hover { background: #2a2a2a; }

  thead th.sort-asc::after  { content: ' ▲'; font-size: 0.75em; color: #aaa; }
  thead th.sort-desc::after { content: ' ▼'; font-size: 0.75em; color: #aaa; }

  tbody tr:nth-child(even) { background: #181818; }
  tbody tr:hover { background: #1e2a1e; }

  td {
    padding: 6px 8px;
    border-bottom: 1px solid #2a2a2a;
    vertical-align: middle;
  }

  td input, td select {
    width: 100%;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    color: #eee;
    padding: 4px 6px;
    font-size: 0.9rem;
  }

  td input:focus, td select:focus {
    outline: none;
    border-color: #555;
    background: #222;
  }

  td select option { background: #222; }

  .del-btn {
    background: none;
    color: #c44;
    font-size: 1.1rem;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .del-btn:hover { background: #3a1a1a; color: #f66; }

  .histoire-len {
    font-variant-numeric: tabular-nums;
    color: #aaa;
    font-size: 0.85rem;
  }

  .histoire-len.high  { color: #6f6; }
  .histoire-len.mid   { color: #fa0; }
  .histoire-len.low   { color: #c44; }
  .histoire-len.none  { color: #555; }

  #placeholder {
    color: #666;
    margin-top: 40px;
    text-align: center;
    font-size: 1rem;
  }

  label.file-label {
    color: #aaa;
    font-size: 0.85rem;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
</style>
</head>
<body>

<h1>Character Editor</h1>

<div id="toolbar">
  <label class="file-label">
    characters.json
    <input type="file" id="file-input" accept=".json">
  </label>
  <label class="file-label">
    enriched.json <span style="color:#555">(optional)</span>
    <input type="file" id="enriched-input" accept=".json">
  </label>
  <button id="save-btn" style="display:none" onclick="saveJSON()">Save JSON</button>
  <input type="text" id="search" placeholder="Filter by name…" style="display:none" oninput="renderTable()">
  <span id="count"></span>
</div>

<div id="placeholder">Load a characters.json file to start editing.</div>
<table id="table" style="display:none">
  <thead>
    <tr id="thead-row">
      <th class="sortable" data-col="name">Name</th>
      <th>Gender</th>
      <th>Affiliation 1</th>
      <th class="sortable" data-col="histoire" id="th-histoire" style="display:none">Histoire</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
let characters = [];
let enriched = {};
let sortCol = null;
let sortDir = 1;

document.getElementById('file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      characters = JSON.parse(ev.target.result);
      document.getElementById('save-btn').style.display = '';
      document.getElementById('search').style.display = '';
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('table').style.display = '';
      renderTable();
    } catch(err) {
      alert('Invalid JSON file.');
    }
  };
  reader.readAsText(file);
});

document.getElementById('enriched-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      enriched = JSON.parse(ev.target.result);
      document.getElementById('th-histoire').style.display = '';
      // Default sort by histoire desc when enriched data first loaded
      sortCol = 'histoire';
      sortDir = -1;
      renderTable();
    } catch(err) {
      alert('Invalid enriched JSON file.');
    }
  };
  reader.readAsText(file);
});

document.getElementById('thead-row').addEventListener('click', function(e) {
  const th = e.target.closest('th[data-col]');
  if (!th) return;
  const col = th.dataset.col;
  if (sortCol === col) {
    sortDir *= -1;
  } else {
    sortCol = col;
    sortDir = col === 'histoire' ? -1 : 1;
  }
  renderTable();
});

function getHistoire(name) {
  const v = enriched[name];
  return v == null ? null : v;
}

function histoireClass(v) {
  if (v == null)   return 'none';
  if (v === 0)     return 'low';
  if (v < 500)     return 'low';
  if (v < 3000)    return 'mid';
  return 'high';
}

function renderTable() {
  const q = document.getElementById('search').value.toLowerCase();

  let visible = characters
    .map((c, i) => ({ c, i }))
    .filter(({ c }) => !q || c.name.toLowerCase().includes(q));

  if (sortCol) {
    visible.sort((a, b) => {
      let va, vb;
      if (sortCol === 'histoire') {
        va = getHistoire(a.c.name) ?? -1;
        vb = getHistoire(b.c.name) ?? -1;
      } else {
        va = a.c.name.toLowerCase();
        vb = b.c.name.toLowerCase();
      }
      if (va < vb) return -1 * sortDir;
      if (va > vb) return  1 * sortDir;
      return 0;
    });
  }

  // Update sort indicators
  document.querySelectorAll('th[data-col]').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.col === sortCol) {
      th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
    }
  });

  document.getElementById('count').textContent = `${visible.length} / ${characters.length} characters`;

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  const hasEnriched = Object.keys(enriched).length > 0;

  visible.forEach(({ c, i }) => {
    const hLen = getHistoire(c.name);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" value="${esc(c.name)}" data-idx="${i}" data-field="name"></td>
      <td>
        <select data-idx="${i}" data-field="gender">
          <option value="Male"${c.gender === 'Male' ? ' selected' : ''}>Male</option>
          <option value="Female"${c.gender === 'Female' ? ' selected' : ''}>Female</option>
          <option value="Unknown"${c.gender !== 'Male' && c.gender !== 'Female' ? ' selected' : ''}>Unknown</option>
        </select>
      </td>
      <td><input type="text" value="${esc(c.affiliation1 ?? '')}" data-idx="${i}" data-field="affiliation1"></td>
      ${hasEnriched ? `<td class="histoire-len ${histoireClass(hLen)}">${hLen == null ? '—' : hLen.toLocaleString()}</td>` : ''}
      <td><button class="del-btn" onclick="deleteChar(${i})" title="Delete">✕</button></td>
    `;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('change', function() {
      const idx = +this.dataset.idx;
      const field = this.dataset.field;
      characters[idx][field] = this.value;
    });
  });
}

function deleteChar(idx) {
  characters.splice(idx, 1);
  renderTable();
}

function saveJSON() {
  const blob = new Blob([JSON.stringify(characters, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'characters.json';
  a.click();
}

function esc(str) {
  return String(str).replace(/"/g, '&quot;').replace(/</g, '&lt;');
}
</script>
</body>
</html>
